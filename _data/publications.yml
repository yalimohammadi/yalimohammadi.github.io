  - authors: "Y. Alimohammadi, P. Diaconis, M. Roghani, A. Saberi"
    title: "Sequential Importance Sampling for Estimating Expectations over the Space of Perfect Matchings"
    venue: "Annals of Applied Probability"
    year: 2023
    arxiv: "#"
    slides: "#"
    video: "#"
    abstract: >
      This paper makes three contributions to estimating the number of perfect
      matchings in bipartite graphs. First, we prove that the popular sequential
      importance sampling algorithm works in polynomial time for dense bipartite
      graphs: our algorithm gives a (1±ε)-approximation for the number of perfect
      matchings of a λ-dense bipartite graph, using O(n^((1−2λ)/λ) ε^(−2)) samples,
      where a λ-dense bipartite graph has all degrees greater than (λ+1/2)n. Second,
      practical applications of the algorithm require many calls to matching
      algorithms; a novel preprocessing step is provided which yields significant
      improvements. Third, three applications are given: counting Latin squares, a
      practical way of computing the greedy algorithm for a card-guessing game with
      feedback, and stochastic block models.

