conferences:
  - authors: "Y. Alimohammadi, L. Ruiz, A. Saberi"
    title: "A Local Graph Limits Perspective on Sampling-Based Graph Neural Networks"
    venue: "ISIT"
    year: 2025
    arxiv: "2310.10953"
    slides: "#"
    video: "https://www.youtube.com/watch?v=SkdEvaMVRR4"
    abstract: >
      We propose a theoretical framework for training Graph Neural Networks (GNNs)
      on large input graphs via training on small, fixed-size sampled subgraphs.
      This framework is applicable to a wide range of models, including popular
      sampling-based GNNs such as GraphSAGE and FastGCN. Leveraging the theory of
      graph local limits, we prove that, under mild assumptions, parameters learned
      from training sampling-based GNNs on small samples of a large input graph are
      within an ε-neighborhood of the outcome of training the same architecture on
      the whole graph. We derive bounds on the number of samples, the size of the
      graph, and the training steps required as a function of ε. We empirically
      illustrate our results on a node classification task on large citation
      graphs, observing that sampling-based GNNs trained on local subgraphs 12×
      smaller than the original achieve comparable performance to those trained on
      the input graph.

  - authors: "Y. Alimohammadi, A. Mehta, A. Perlroth"
    title: "Incentive Compatibility in the Auto-bidding World"
    venue: "EC"
    year: 2023
    arxiv: "#"
    slides: "#"
    video: "https://www.youtube.com/watch?v=8yQCjh9en6g"
    abstract: > 
      Auto-bidding has recently become a popular feature in ad auctions: advertisers
      provide high-level constraints and goals to an automated agent, which optimizes
      their auction bids on their behalf. We examine the effect of different auction
      rules on the incentives of advertisers to truthfully report their constraints
      to the auto-bidder intermediaries. More precisely, we study whether canonical
      auctions such as first-price (FPA) and second-price (SPA) are auto-bidding
      incentive compatible (AIC) — that is, whether an advertiser can gain by
      misreporting their constraints to the autobidder.

  - authors: "Y. Alimohammadi, C. Borgs, A. Saberi"
    title: "Algorithms Using Local Graph Features to Predict Epidemics"
    venue: "SODA"
    year: 2022
    arxiv: "2110.08961"
    slides: "#"
    video: "#"
    abstract: >
      We study a simple model of epidemics where an infected node transmits the
      infection to its neighbors independently with probability p — also known as the
      independent cascade or SIR model with fixed recovery time. The size of an
      outbreak in this model is closely related to that of the giant connected
      component in edge percolation. Even though existing models capture the effects
      of degree inhomogeneity and the role of super-spreaders, they only consider
      graphs that are locally tree-like, i.e., have few or no short cycles. We give
      an algorithm that returns a (1−ε) approximation of the probability and final
      size of an outbreak by accessing a constant-size neighborhood of a constant
      number of nodes chosen uniformly at random — without requiring local
      tree-likeness.

  - authors: "M. Akbarpour, Y. Alimohammadi, S. Li, A. Saberi"
    title: "The Value of Excess Supply in Spatial Matching Markets"
    venue: "EC"
    year: 2022
    arxiv: "2104.03219"
    slides: "#"
    video: "https://www.youtube.com/watch?v=pYp0p6kovAM"
    abstract: >
      We study dynamic matching in a spatial setting. Drivers are distributed at
      random on some interval. Riders arrive in some (possibly adversarial) order at
      randomly drawn points. The platform observes the location of the drivers and
      can match newly arrived riders immediately, or can wait for more riders to
      arrive; unmatched riders incur a waiting cost c per period. We quantify the
      value of slightly increasing supply: when there are (1+ε) drivers per rider
      (for any ε > 0), the cost of matching returned by a simple greedy algorithm —
      which pairs each arriving rider to the closest available driver — is provably
      better than that of the ex-post optimal matching with exactly one driver per
      rider. No level of sophistication in the matching algorithm and no amount of
      data to predict times and locations of future demand can beat a naive greedy
      algorithm with a small excess supply.

  - authors: "Y. Alimohammadi, N. Anari, K. Shiragur, T.-D. Vuong"
    title: "Fractionally Log-Concave and Sector-Stable Polynomials: Counting Planar Matchings and More"
    venue: "STOC"
    year: 2021
    arxiv: "2102.02708"
    slides: "#"
    video: "#"
    abstract: >
      We show fully polynomial time randomized approximation schemes (FPRAS) for
      counting matchings of a given size, or more generally sampling/counting
      monomer–dimer systems in planar, not-necessarily-bipartite graphs. While
      perfect matchings on planar graphs can be counted exactly in polynomial time,
      counting non-perfect matchings was shown by Jerrum to be #P-hard, who also
      raised the question of whether efficient approximate counting is possible. We
      answer this affirmatively by showing that the multi-site Glauber dynamics on
      the set of monomers in a monomer–dimer system always mixes rapidly, and that
      this dynamics can be implemented efficiently on downward-closed families of
      graphs where counting perfect matchings is tractable. As further applications,
      we show how to sample efficiently from partition-constrained strongly Rayleigh
      distributions and nonsymmetric determinantal point processes.
