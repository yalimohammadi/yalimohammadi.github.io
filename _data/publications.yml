  - authors: "Y. Alimohammadi, C. Borgs, J. Chayes, K. Huang"
    title: "Auditing the Auditors: Does Community-based Moderation Get It Right?"
    arxiv: "2603.18053"
    slides: "#"
    video: "#"
    abstract: >
      Online social platforms increasingly rely on crowd-sourced systems to label
      misleading content at scale, but these systems must both aggregate users'
      evaluations and decide whose evaluations to trust. To address the latter, many
      platforms audit users by rewarding agreement with the final aggregate outcome —
      a design we term consensus-based auditing. We analyze the consequences of this
      design in X's Community Notes, which in September 2022 adopted consensus-based
      auditing that ties users' eligibility for participation to agreement with the
      eventual platform outcome. We find evidence of strategic conformity: minority
      contributors' evaluations drift toward the majority and their participation
      share falls on controversial topics, where independent signals matter most. We
      formalize this mechanism in a behavioral model in which contributors trade off
      private beliefs against anticipated penalties for disagreement.

  - authors: "Y. Alimohammadi, K. Asgari"
    title: "How to Measure Differences in Ranking Models? Maximum Likelihood Estimation and Sampling from Mallows Model with Learned Metric"
    arxiv: "2507.08108"
    slides: "#"
    video: "https://www.youtube.com/watch?v=aYAPbYV9Ars"
    abstract: >
      The Mallows model is a widely-used probabilistic framework for learning from
      ranking data, with applications ranging from recommendation systems and voting
      to aligning language models with human preferences. Under this model, observed
      rankings are noisy perturbations of a central ranking σ, with likelihood
      decaying exponentially in distance from σ. Existing methods mainly focus on
      fixed distances (such as Kendall's τ distance), with no principled approach to
      learning the distance metric directly from data. In practice, however, rankings
      naturally vary by context. We focus on the L_α Mallows model and present an
      efficient Maximum Likelihood Estimation algorithm that jointly estimates the
      central ranking σ, the dispersion parameter β, and the distance parameter α.


  - authors: "Y. Alimohammadi, S. Isik, A. Saberi"
    title: "Local Limits of Small-World Networks"
    arxiv: "2501.11226"
    slides: "#"
    video: "#"
    abstract:  >
      Small-world networks, known for high local clustering and short path lengths,
      are a fundamental structure in many real-world systems, including social,
      biological, and technological networks. We apply the theory of (marked) local
      convergence (also known as Benjamini–Schramm convergence) to derive the limiting
      behavior of the local structures for two commonly studied small-world network
      models: the Watts–Strogatz and the Kleinberg models. Establishing local
      convergence enables us to show that key network measures, such as clustering
      coefficient, PageRank, greedy maximal independent set, number of spanning
      trees, and tree entropy, converge as network size increases, with their limits
      determined by the graph's local structure. We further observe a critical change
      in the behavior of the limit exactly when the parameter governing long-range
      connections in the Kleinberg model crosses the threshold where decentralized
      search remains efficient, offering a new perspective on why decentralized
      algorithms fail in certain regimes.

journals:
  - authors: "Y. Alimohammadi, C. Borgs, R. van der Hofstad, A. Saberi"
    title: "Epidemic Forecasting on Networks: Bridging Local Samples with Global Outcomes"
    venue: "Operations Research"
    year: 2026
    arxiv: "#"
    slides: "#"
    video: "#"
    abstract:  >
      We study how to predict the trajectory of an SIR epidemic on a network when
      the full network is unobservable. We design a local algorithm that, given a
      randomly chosen target node, explores at most k of its neighbors by simulating
      the epidemic process backward in time, and infers when the target would have
      been infected. Averaging over q random target nodes yields an estimator for
      the global fractions S(t), I(t), R(t). Under a tightness condition on the
      network sequence, we prove that the sample size required for ε accuracy is a
      constant independent of network size — both k and q remain bounded as the
      population grows. The result extends to random network models under a
      stability condition on local neighborhood distributions, and to weighted
      sampling. We validate the predictions on Copenhagen contact data and on a
      large-scale mobility network of San Francisco.

